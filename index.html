<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8" />
      <title>My Productivity Hub</title>
      <link rel="stylesheet" href="styles/main.css">
</head>

<body>
  <div class="app">
        <!-- ================= LEFT SIDEBAR ================= -->
        <aside id="leftPanel" class="panel left">

        <header> 
            <h3 id="leftPanelTitle">Deadlines</h3> 

            <div class="left-controls">
            <div id="viewToggle" class="view-toggle">
            <span class="toggle-option active" data-view="deadlines" title="Deadlines">
                ⏳
            </span>
            <span class="toggle-option" data-view="todos" title="Today Tasks">
                📅
            </span>
            </div>

            <button id="leftToggleBtn">☰</button>
            </div>
        </header>

        <!-- Deadline List -->
        <div id="globalDeadlineList" class="deadline-list"></div>

        <!-- Add Button -->
        <button id="addDeadlineBtn" class="add-deadline-btn">
            + New Deadline
        </button>

        </aside>
        <!-- ================= CENTER DASHBOARD ================= -->
        <main class="center"></main>
      <!-- ================= RIGHT SIDEBAR ================= -->
      <aside id="rightPanel" class="panel right">
          <header>
              <h3>Vocabulary Vault</h3>
              <button id="rightToggleBtn">☰</button>
          </header>
          <div class="vault-stats">
            <span>Total: <b id="totalWords">0</b></span>
            <span>Learning: <b id="learningWords">0</b></span>
            <span>Learned: <b id="learnedWords">0</b></span>
            </div>
            <br>
                    <!-- WORD LIST -->
          <div id="wordList" class="word-list">
              <!-- Words will appear here -->
          </div>
          <button class="add-word-btn">
            + Add Word
          </button>
          <div id="wordForm" class="word-form hidden">
              <select id="languageInput">
                  <option value="English">English</option>
                  <option value="Hindi">Hindi</option>
              </select>
              <input id="wordInput" placeholder="Word" />
              <textarea id="meaningInput" placeholder="Meaning"></textarea>
              <textarea id="sentenceInput" placeholder="Sample sentence"></textarea>
              <label class="display-toggle">
                  <input type="checkbox" id="displayInput" checked />
                  Display on screen
              </label>
              <button class="save-word-btn">
                  Save
              </button>
          </div>
      </aside>
  </div>
  <div id="overlay-root">
    <!-- all modals -->
  </div>
  <!-- ================= TRACK SETTINGS MODAL ================= -->
  <div id="trackSettingsModal" class="modal hidden">
      <div class="modal-content">
          <button id="closeTrackModalBtn" class="modal-close-btn">✖</button>
          <h3>Manage Tracks</h3>
          <div id="trackList"></div>
          <div class="add-track-header">
              <span>Add New Track</span>
              <button id="addTrackInlineBtn" class="add-icon-btn">➕</button>
          </div>
      </div>
  </div>
  <!-- ================= DELETE CONFIRMATION MODAL ================= -->
  <div id="deleteConfirmModal" class="modal hidden">
    <div class="modal-content">
      <h3>Delete Track</h3>
      <p id="deleteConfirmText"></p>
      <div class="confirm-actions">
        <button id="confirmDeleteBtn">Yes, Delete</button>
        <button id="cancelDeleteBtn">Cancel</button>
      </div>
    </div>
  </div>
  <div id="toastMessage" class="toast hidden"></div>
<!-- CORE -->
<script src="js/core/storage.js"></script>
<script src="js/core/app.js"></script>

<!-- COMPONENTS -->
<script src="js/components/toast.js"></script>
<script src="js/components/modals.js"></script>
<script src="js/components/iconPicker.js"></script>
<script src="js/components/progressRing.js"></script>

<!-- FEATURES -->
<script src="js/features/wotd.js"></script>
<script src="js/features/vocabulary.js"></script>
<script src="js/features/deadlines.js"></script>
<script src="js/features/dashboard.js"></script>
<script src="js/panels.js"></script>
<script src="js/tracks.js"></script>
<script src="js/trackView.js"></script>
<script src="js/words.js"></script>
<script src="js/googleDictionaryIntegration.js"></script>
  <!-- ================= DELETE WORD MODAL ================= -->
   <div id="deleteWordModal" class="modal hidden">
    <div class="modal-content">
        <h3>Delete Word</h3>
        <p id="deleteWordText"></p>
        <div class="confirm-actions">
        <button id="cancelDeleteWordBtn" class="neutral-btn">
            Cancel
        </button>
        <button id="confirmDeleteWordBtn" class="danger-btn">
            Delete
        </button>
        </div>

    </div>
    </div>
    <!-- =====================================
        Add Track Modal
    ===================================== -->

    <div id="addTrackModal" class="modal hidden">
    <div class="modal-content add-track-modal-content">
        <div class="modal-header">
        <h2>Create New Track</h2>
        <button id="closeAddTrackModalBtn">
            ✕
        </button>
        </div>
        <div class="add-track-form">
        <input
            type="text"
            id="newTrackName"
            placeholder="Track name"
        />
        <div
            id="newTrackIconPicker"
            class="icon-picker"
        ></div>
        <div class="add-track-modal-actions">
            <button
            id="saveNewTrackBtn"
            class="primary-btn"
            >
            Create Track
            </button>

            <button
            id="cancelNewTrackBtn"
            class="neutral-btn"
            >
            Cancel
            </button>
        </div>
        </div>
    </div>
    </div>
</body>
</html>
