<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8" />
      <title>My Productivity Hub</title>
      <link rel="stylesheet" href="styles/main.css">
</head>

<body>
  <div class="app">
        <!-- ================= LEFT SIDEBAR ================= -->
        <aside id="leftPanel" class="panel left">

        <header> 
            <h3 id="leftPanelTitle">Deadlines</h3> 

            <div class="left-controls">
            <div id="viewToggle" class="view-toggle">
            <span class="toggle-option active" data-view="deadlines" title="Deadlines">
                ⏳
            </span>
            <span class="toggle-option" data-view="todos" title="Today Tasks">
                📅
            </span>
            </div>

            <button id="leftToggleBtn">☰</button>
            </div>
        </header>

        <!-- Deadline List -->
        <div id="globalDeadlineList" class="deadline-list"></div>

        <!-- Add Button -->
        <button id="addDeadlineBtn" class="add-deadline-btn">
            + New Deadline
        </button>

        </aside>
        <!-- ================= CENTER DASHBOARD ================= -->
        <main class="center"></main>
      <!-- ================= RIGHT SIDEBAR ================= -->
      <aside id="rightPanel" class="panel right">
          <header>
              <h3>Vocabulary Vault</h3>
              <button id="rightToggleBtn">☰</button>
          </header>
          <select
            id="vaultLanguageFilter"
            class="vault-language-filter"
            >
            <option value="All">
                All Languages
            </option>
          </select>
          <br>
          <div class="vault-stats">
            <span>Total: <b id="totalWords">0</b></span>
            <span>Learning: <b id="learningWords">0</b></span>
            <span>Learned: <b id="learnedWords">0</b></span>
            </div>
            <br>
                    <!-- WORD LIST -->
          <div id="wordList" class="word-list">
              <!-- Words will appear here -->
          </div>
          <button class="add-word-btn">
            + Add Word
          </button>
            <div id="wordForm" class="word-form hidden">
                <div class="language-input-row">
                    <select id="languageInput">
                        <option value="English">
                            English
                        </option>
                        <option value="Urdu">
                            Urdu
                        </option>
                    </select>
                    <button
                    id="addLanguageBtn"
                    type="button"
                    >
                        + Add
                    </button>
                </div>

                <input
                id="wordInput"
                placeholder="Word"
                />

                <textarea
                id="meaningInput"
                placeholder="Meaning"
                ></textarea>

                <textarea
                id="sentenceInput"
                placeholder="Sample sentence"
                ></textarea>

                <div class="word-form-actions">

                    <button class="save-word-btn">
                        Save
                    </button>

                    <button
                    class="cancel-word-btn"
                    type="button"
                    >
                        Cancel
                    </button>

                </div>

            </div>
      </aside>
  </div>
  <div id="overlay-root">
    <!-- all modals -->
  </div>
  <!-- ================= TRACK SETTINGS MODAL ================= -->
  <div id="trackSettingsModal" class="modal hidden">
      <div class="modal-content">
          <button id="closeTrackModalBtn" class="modal-close-btn">✖</button>
          <h3>Manage Tracks</h3>
          <div id="trackList"></div>
          <div class="add-track-header">
              <span>Add New Track</span>
              <button id="addTrackInlineBtn" class="add-icon-btn">➕</button>
          </div>
      </div>
  </div>
  <!-- ================= DELETE CONFIRMATION MODAL ================= -->
  <div id="deleteConfirmModal" class="modal hidden">
    <div class="modal-content">
      <h3>Delete Track</h3>
      <p id="deleteConfirmText"></p>
      <div class="confirm-actions">
        <button id="confirmDeleteBtn">Yes, Delete</button>
        <button id="cancelDeleteBtn">Cancel</button>
      </div>
    </div>
  </div>
  <div id="toastMessage" class="toast hidden"></div>
<!-- CORE -->
<script src="js/core/storage.js"></script>
<script src="js/core/app.js"></script>
<script src="js/core/dateUtils.js"></script>

<!-- COMPONENTS -->
<script src="js/components/toast.js"></script>
<script src="js/components/modals.js"></script>
<script src="js/components/iconPicker.js"></script>
<script src="js/components/progressRing.js"></script>

<!-- DASHBOARD -->
<script src="js/features/dashboard/dashboardTemplate.js"></script>
<script src="js/features/dashboard/dashboard.js"></script>

<!-- PANELS -->
<script src="js/features/dashboard/panels/leftPanel.js"></script>

<!-- TRACKS -->
<script src="js/features/dashboard/tracks/trackStats.js"></script>
<script src="js/features/dashboard/tracks/trackDragDrop.js"></script>
<script src="js/features/dashboard/tracks/trackModal.js"></script>
<script src="js/features/dashboard/tracks/tracksView.js"></script>

<!-- PROJECTS -->
<script src="js/features/dashboard/projects/projectActions.js"></script>
<script src="js/features/dashboard/projects/projectAnalytics.js"></script>
<script src="js/features/dashboard/projects/projectModal.js"></script>
<script src="js/features/dashboard/projects/projectsView.js"></script>

<script src="js/features/dashboard/timeline/timelineModal.js"></script>
<script src="js/features/dashboard/timeline/timelineStorage.js"></script>
<script src="js/features/dashboard/timeline/timelineClock.js"></script>
<script src="js/features/dashboard/timeline/timelineView.js"></script>

<!-- WOTD -->
<script src="js/features/wotd.js"></script>
<script src="js/features/wotdEvents.js"></script>

<!-- OTHER FEATURES -->
<script src="js/features/deadlines.js"></script>
<script src="js/features/workspace.js"></script>

<!-- APP -->
<script src="js/panels.js"></script>
<script src="js/words.js"></script>
<script src="js/googleDictionaryIntegration.js"></script>
<script src="js/main.js"></script>
  <!-- ================= DELETE WORD MODAL ================= -->
   <div id="deleteWordModal" class="modal hidden">
    <div class="modal-content">
        <h3>Delete Word</h3>
        <p id="deleteWordText"></p>
        <div class="confirm-actions">
        <button id="cancelDeleteWordBtn" class="neutral-btn">
            Cancel
        </button>
        <button id="confirmDeleteWordBtn" class="danger-btn">
            Delete
        </button>
        </div>

    </div>
    </div>

    <!-- ================= DISCARD WORD MODAL ================= -->
    <div id="discardWordModal" class="modal hidden">
    <div class="modal-content">
        <h3>Discard Word Entry</h3>
        <p>
            Are you sure you want to discard this entry?
        </p>
        <div class="confirm-actions">
            <button
            id="cancelDiscardWordBtn"
            class="neutral-btn"
            >
            Continue Editing
            </button>
            <button
            id="confirmDiscardWordBtn"
            class="danger-btn"
            >
            Discard
            </button>
        </div>
    </div>
    </div>
    <!-- =====================================
        Add Track Modal
    ===================================== -->

    <div id="addTrackModal" class="modal hidden">
    <div class="modal-content add-track-modal-content">
        <div class="modal-header">
        <h2>Create New Track</h2>
        <button id="closeAddTrackModalBtn">
            ✕
        </button>
        </div>
        <div class="add-track-form">
        <input
            type="text"
            id="newTrackName"
            placeholder="Track name"
        />
        <div
            id="newTrackIconPicker"
            class="icon-picker"
        ></div>
        <div class="add-track-modal-actions">
            <button
            id="saveNewTrackBtn"
            class="primary-btn"
            >
            Create Track
            </button>

            <button
            id="cancelNewTrackBtn"
            class="neutral-btn"
            >
            Cancel
            </button>
        </div>
        </div>
    </div>
    </div>
    <!-- =====================================
        MANAGE PROJECTS MODAL
    ===================================== -->

    <div
    id="manageProjectsModal"
    class="modal hidden"
    >

    <div
        class="modal-content manage-projects-modal-content"
    >

        <!-- =============================
            HEADER
        ============================== -->

        <div class="modal-header">

        <h2>
            Manage Projects
        </h2>

        <button
            id="closeManageProjectsModalBtn"
        >
            ✕
        </button>

        </div>

        <!-- =============================
            NAVIGATION
        ============================== -->

        <div class="manage-projects-nav">
        <button
        id="currentProjectsTab"
        class="manage-projects-tab active"
        data-tab="current"
        >
        Current (0)
        </button>

        <button
        id="pausedProjectsTab"
        class="manage-projects-tab"
        data-tab="paused"
        >
        Paused (0)
        </button>

        <button
        id="completedProjectsTab"
        class="manage-projects-tab"
        data-tab="completed"
        >
        Completed (0)
        </button>

        </div>

        <!-- =============================
            CONTENT
        ============================== -->

        <div id="manageProjectsContent"></div>

        <!-- =============================
            FOOTER ACTIONS
        ============================== -->

        <div class="manage-projects-footer">

            <div class="manage-projects-add-form">

                <input
                    type="text"
                    id="projectNameInput"
                    placeholder="Project name"
                />

                <input
                    type="number"
                    id="projectTargetInput"
                    placeholder="Hours per day"
                    min="0.5"
                    step="0.5"
                />

                <button
                    id="saveProjectBtn"
                    class="primary-btn"
                >
                    + Add Project
                </button>

            </div>

        </div>

    </div>

    </div>

    <!-- =====================================
        TIMELINE MODAL
    ===================================== -->

    <div
    id="timelineModal"
    class="modal hidden"
    >

        <div
            class="
                modal-content
                timeline-modal-content
            "
        >

            <!-- HEADER -->

            <div class="modal-header">

                <h2>
                    Add Activity
                </h2>

                <button
                    id="closeTimelineModalBtn"
                >
                    ✕
                </button>

            </div>

            <!-- FORM -->

            <div class="timeline-form">

                <!-- ACTIVITY -->

                <label
                    class="timeline-field-label"
                    for="timelineActivityInput"
                >
                    Activity
                </label>

                <input
                    id="timelineActivityInput"
                    list="timelineActivitySuggestions"
                    placeholder="What were you working on?"
                />

                <datalist
                    id="timelineActivitySuggestions"
                ></datalist>

                <!-- CLOCK -->

                <div
                    id="timelineClockContainer"
                ></div>

                <!-- TIME SUMMARY -->

                <div
                    class="timeline-selected-times"
                >

                    <span>

                        <small>
                            START
                        </small>

                        <b
                            id="selectedStartTime"
                        >
                            --:--
                        </b>

                    </span>

                    <span>

                        <small>
                            END
                        </small>

                        <b
                            id="selectedEndTime"
                        >
                            --:--
                        </b>

                    </span>

                </div>

                <!-- DETAILS CARD -->

                <div
                    class="timeline-details-card"
                >

                    <div
                        class="timeline-meta-row"
                    >

                        <div
                            class="timeline-meta-field"
                        >

                            <label
                                class="timeline-field-label"
                            >
                                Project
                            </label>

                            <select
                                id="timelineProjectSelect"
                            >
                            </select>

                        </div>

                        <div
                            class="timeline-meta-field"
                        >

                            <label
                                class="timeline-field-label"
                            >
                                Track
                            </label>

                            <select
                                id="timelineTrackSelect"
                            >
                            </select>

                        </div>

                    </div>

                </div>

                <!-- ACTIONS -->

                <div
                    class="timeline-actions"
                >

                    <button
                        id="saveTimelineEntryBtn"
                        class="timeline-save-btn primary-btn"
                    >
                        Save Activity
                    </button>

                </div>

            </div>

        </div>

    </div>
</body>
</html>
