<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8" />
      <title>My Productivity Hub</title>
      <link rel="stylesheet" href="css/layout.css" />
      <link rel="stylesheet" href="css/panels.css" />
      <link rel="stylesheet" href="css/cards.css" />
</head>

<body>
  <div class="app">
        <!-- ================= LEFT SIDEBAR ================= -->
        <aside id="leftPanel" class="panel left">

        <header> 
            <h3 id="leftPanelTitle">Deadlines</h3> 

            <div class="left-controls">
            <div id="viewToggle" class="view-toggle">
            <span class="toggle-option active" data-view="deadlines" title="Deadlines">
                ⏳
            </span>
            <span class="toggle-option" data-view="todos" title="Today Tasks">
                📅
            </span>
            </div>

            <button id="leftToggleBtn">☰</button>
            </div>
        </header>

        <!-- Deadline List -->
        <div id="globalDeadlineList" class="deadline-list"></div>

        <!-- Add Button -->
        <button id="addDeadlineBtn" class="add-deadline-btn">
            + New Deadline
        </button>

        </aside>
        <!-- ================= CENTER DASHBOARD ================= -->
        <main class="center">
            <div class="center-header">
                <h2>My Tracks</h2>
                <button id="trackSettingsBtn">⚙</button>
          </div>
          <div id="trackGrid" class="grid">
            <!-- Track cards will render here -->
          </div>  
      </main>
      <!-- ================= RIGHT SIDEBAR ================= -->
      <aside id="rightPanel" class="panel right">
          <header>
              <h3>Vocabulary Vault</h3>
              <button id="rightToggleBtn">☰</button>
          </header>
          <div class="vault-stats">
            <span>Total: <b id="totalWords">0</b></span>
            <span>Learning: <b id="learningWords">0</b></span>
            <span>Learned: <b id="learnedWords">0</b></span>
            </div>

            <div class="word-of-day">
            <h4>🌟 Word of the Day</h4>
            <p id="wotdWord"></p>
            <small id="wotdMeaning"></small>
            </div>
                    <!-- WORD LIST -->
          <div id="wordList" class="word-list">
              <!-- Words will appear here -->
          </div>
          <button class="add-word-btn">
            + Add Word
          </button>
          <div id="wordForm" class="word-form hidden">
              <select id="languageInput">
                  <option value="English">English</option>
                  <option value="Hindi">Hindi</option>
              </select>
              <input id="wordInput" placeholder="Word" />
              <textarea id="meaningInput" placeholder="Meaning"></textarea>
              <textarea id="sentenceInput" placeholder="Sample sentence"></textarea>
              <label class="display-toggle">
                  <input type="checkbox" id="displayInput" checked />
                  Display on screen
              </label>
              <button class="save-word-btn">
                  Save
              </button>
          </div>
      </aside>
  </div>
  <div id="overlay-root">
    <!-- all modals -->
  </div>
  <!-- ================= TRACK SETTINGS MODAL ================= -->
  <div id="trackSettingsModal" class="modal hidden">
      <div class="modal-content">
          <button id="closeTrackModalBtn" class="modal-close-btn">✖</button>
          <h3>Manage Tracks</h3>
          <div id="trackList"></div>
          <div class="add-track-header">
              <span>Add New Track</span>
              <button id="addTrackInlineBtn" class="add-icon-btn">➕</button>
          </div>
      </div>
  </div>
  <!-- ================= DELETE CONFIRMATION MODAL ================= -->
  <div id="deleteConfirmModal" class="modal hidden">
    <div class="modal-content">
      <h3>Delete Track</h3>
      <p id="deleteConfirmText"></p>
      <div class="confirm-actions">
        <button id="confirmDeleteBtn">Yes, Delete</button>
        <button id="cancelDeleteBtn">Cancel</button>
      </div>
    </div>
  </div>
  <div id="toastMessage" class="toast hidden"></div>
  <script src="js/panels.js"></script>
  <script src="js/words.js"></script>
  <script src="js/tracks.js"></script>
  <script src="js/trackView.js"></script>
</body>
</html>
